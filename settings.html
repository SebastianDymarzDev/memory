<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memory - Settings</title>

    <link rel="icon" type="image/png" href="/assets/img/icons/stadia_controller.png">
</head>

<body>
    <section class="settings">
        <h2 class="settings__title">Settings</h2>

        <div class="settings__inner">
            <div class="settings__options">
                <fieldset class="settings__group">
                    <legend class="settings__heading">
                        <img src="/assets/img/icons/palette.png" alt="">Game themes
                    </legend>
                    <label class="settings__option"><input type="radio" name="theme" value="code" data-short="Code vibes" checked><span>Code
                            vibes theme</span></label>
                    <label class="settings__option"><input type="radio" name="theme" value="games" data-short="Gaming"><span>Gaming
                            theme</span></label>
                    <label class="settings__option"><input type="radio" name="theme" value="projects" data-short="DA Projects"><span>DA Projects
                            theme</span></label>
                    <label class="settings__option"><input type="radio" name="theme" value="food" data-short="Foods"><span>Foods
                            theme</span></label>
                </fieldset>

                <fieldset class="settings__group">
                    <legend class="settings__heading">
                        <img src="/assets/img/icons/chess_pawn_mint.png" alt="">Choose player
                    </legend>
                    <label class="settings__option"><input type="radio" name="player"
                            value="blue"><span>Blue</span></label>
                    <label class="settings__option"><input type="radio" name="player"
                            value="orange"><span>Orange</span></label>
                </fieldset>

                <fieldset class="settings__group">
                    <legend class="settings__heading">
                        <img src="/assets/img/icons/board_size.png" alt="">Board size
                    </legend>
                    <label class="settings__option"><input type="radio" name="size" value="16"><span>16
                            cards</span></label>
                    <label class="settings__option"><input type="radio" name="size" value="24"><span>24
                            cards</span></label>
                    <label class="settings__option"><input type="radio" name="size" value="36"><span>36
                            cards</span></label>
                </fieldset>

                <fieldset class="settings__group">
                    <legend class="settings__heading">
                        <img src="/assets/img/icons/smart_toy.png" alt="">Opponent
                    </legend>
                    <label class="settings__option"><input type="radio" name="opponent" value="human" data-short="Human"><span>Human
                            player</span></label>
                    <label class="settings__option"><input type="radio" name="opponent" value="easy" data-short="Easy"><span>Computer
                            (easy)</span></label>
                    <label class="settings__option"><input type="radio" name="opponent" value="medium" data-short="Medium"><span>Computer
                            (medium)</span></label>
                    <label class="settings__option"><input type="radio" name="opponent" value="hard" data-short="Hard"><span>Computer
                            (hard)</span></label>
                </fieldset>
            </div>

            <div class="settings__side">
                <img class="settings__preview" id="preview" src="/assets/img/code_vibes/code_example.png" alt="Preview">

                <div class="settings__bar">
                    <span data-step="theme">Game theme</span>
                    <img class="settings__sep" src="/assets/img/icons/Line%206.png" alt="">
                    <span data-step="player">Player</span>
                    <img class="settings__sep" src="/assets/img/icons/Line%206.png" alt="">
                    <span data-step="size">Board size</span>
                    <img class="settings__sep" src="/assets/img/icons/Line%206.png" alt="">
                    <span data-step="opponent">Opponent</span>
                    <button class="settings__start" id="start-btn" type="button" disabled>
                        <img src="/assets/img/icons/smart_display.png" alt=""><span>Start</span>
                    </button>
                </div>
            </div>
        </div>
    </section>

    <script type="module" src="./src/settings.ts"></script>
</body>

</html>
